<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ITC Evaluaciones - Certificado</title>
  <meta name="description" content="Certificado de aprobacion de capacitacion">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0058FF">
  <link rel="icon" href="/img/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    document.documentElement.dataset.theme = localStorage.getItem('theme') || 'light';
    document.documentElement.dataset.fontSize = localStorage.getItem('fontSize') || '100';
  </script>
</head>
<body class="certificado-body">

  <a href="#certificate" class="skip-link">Saltar al certificado</a>

  <header class="certificado-navbar no-print">
    <a href="/dashboard" class="btn-back">&larr; Volver</a>
    <div>
      <button type="button" class="btn-primary" id="btnPrint" style="padding:8px 16px;font-size:.85rem;">Imprimir / Guardar PDF</button>
    </div>
  </header>

  <main id="certificate" class="certificado-main">
    <div class="loading-container">
      <div class="loading-spinner"></div>
      <span>Cargando certificado...</span>
    </div>
  </main>

  <script>
    window.addEventListener('load', function () {
      var btn = document.getElementById('btnPrint');
      if (btn) btn.addEventListener('click', function () { window.print(); });
    });
  </script>
  <script src="/js/common.js"></script>
  <script src="/js/certificado.js"></script>
</body>
</html>
